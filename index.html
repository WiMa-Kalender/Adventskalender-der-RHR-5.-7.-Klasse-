<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventskalender der RHR für die 5. - 7. Jahrgangsstufe</title>
<style>
:root{--bg:#fdf3e7;--fg:#2b2320;--card:#fff;--red:#b3262e;--green:#1f6b4a;--gold:#e0a526;--mut:#6d5f57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202a;--fg:#f6ede4;--card:#223040;--red:#e0555c;--green:#4fb98a;--gold:#f0c24a;--mut:#b9aca3}}
:root[data-theme="dark"]{--bg:#17202a;--fg:#f6ede4;--card:#223040;--red:#e0555c;--green:#4fb98a;--gold:#f0c24a;--mut:#b9aca3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;line-height:1.5}
header{text-align:center;padding:24px 16px 8px}
h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem);color:var(--red)}
header p{margin:6px 0 0;color:var(--mut)}
.bar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 16px;font-size:.9rem;color:var(--mut)}
.bar label{cursor:pointer}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.door{aspect-ratio:1;border:3px solid var(--gold);border-radius:14px;background:linear-gradient(145deg,var(--red),#7d1a20);color:#fff;font:700 1.9rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.door:nth-child(3n){background:linear-gradient(145deg,var(--green),#124632)}
.door:hover:not(:disabled){transform:translateY(-2px)}
.door:disabled{opacity:.45;cursor:not-allowed}
.door.open{background:var(--card);color:var(--fg);border-style:dashed;font-size:1.7rem}
.door small{display:block;font-size:.7rem;font-weight:400}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.on{display:flex}
.card{background:var(--card);color:var(--fg);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;border-top:8px solid var(--gold)}
.art{display:block;width:100%;max-width:340px;margin:8px auto;border-radius:14px}
.ans{font-size:1.1rem}
.meme .art{max-width:100%;margin:8px 0}
.solo header,.solo .bar,.solo main{display:none}
.solo #ov{background:var(--bg)}
.tag{display:inline-block;background:var(--green);color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem}
.card h2{margin:10px 0 6px;color:var(--red)}
.big{font-size:4.5rem;text-align:center;line-height:1.1;margin:8px 0}
.meme{background:#2d3a4a;border-radius:12px;padding:14px 10px;text-align:center;color:#fff;font:900 1.25rem Impact,"Arial Black",sans-serif;text-transform:uppercase;text-shadow:2px 2px 0 #000;margin:10px 0}
.meme .big{text-shadow:none}
.card ol,.card ul{padding-left:22px;margin:6px 0}
.btn{display:inline-block;margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--green)}
.ans{display:none;font-weight:700;color:var(--green);text-align:center;margin-top:10px}
.note{font-size:.8rem;color:var(--mut);margin-top:12px}
</style>
</head>

var grid=document.getElementById("grid"),ov=document.getElementById("ov"),card=document.getElementById("card"),info=document.getElementById("info");
var seen={};try{seen=JSON.parse(localStorage.getItem("adv")||"{}")}catch(e){}
function save(){try{localStorage.setItem("adv",JSON.stringify(seen))}catch(e){}}
function isOpen(n){var d=new Date();return d.getMonth()===0||d>=new Date(d.getFullYear(),11,n)}
function draw(){
  grid.innerHTML="";
  var now=new Date(),c=0;
  D.forEach(function(x,i){
    var n=i+1,b=document.createElement("button");
    b.className="door"+(seen[n]?" open":"");
    b.disabled=!isOpen(n);
    b.setAttribute("aria-label","Türchen "+n);
    b.innerHTML=seen[n]?x.e+"<small>"+n+"</small>":n;
    if(seen[n])c++;
    b.onclick=function(){location.hash="tuerchen-"+n};
    grid.appendChild(b);
  });
  info.textContent=c+" von 24 Türchen geöffnet";
}
function show(n){
  var x=D[n-1],h='<span class="tag">'+L[x.k]+' · Türchen '+n+'</span><h2>'+x.t+'</h2>';
  if(x.k==="m"){var p=x.b.split("|");h+='<div class="meme">'+p[0]+(MR[n]||'<div class="big">'+x.e+'</div>')+p[1]+'</div>'}
  else if(x.k==="j"){h+=(AR[n]||'<div class="big">'+x.e+'</div>')+'<p>'+x.b+'</p><div style="text-align:center"><button class="btn alt" id="rv">Antwort zeigen</button></div><div class="ans" id="an">'+x.a+'</div>'}
  else if(x.k==="q"){h+='<div class="big">'+x.e+'</div><p>'+x.b+'</p><p class="note" id="hn" style="display:none">💡 Tipp: '+x.h+'</p><div style="text-align:center"><button class="btn" id="hb">Tipp zeigen</button> <button class="btn alt" id="rv">Lösung zeigen</button></div><div class="ans" id="an">'+x.a+'</div>'}
  else{h+='<div class="big">'+x.e+'</div><p>'+x.b+'</p>'}
  if(x.k==="s")h+='<a class="btn" target="_blank" rel="noopener" href="'+yt(x.q)+'">▶ Auf YouTube anhören</a><p class="note">Bitte nur mit Erlaubnis von Lehrkraft oder Eltern öffnen.</p>';
  if(x.k==="r")h+='<p class="note">Backofen und Herd bitte nur mit einem Erwachsenen benutzen.</p>';
  h+=solo?'':'<div style="text-align:right"><button class="btn" id="cl">Schließen</button></div>';
  card.innerHTML=h;ov.classList.add("on");
  var hb=document.getElementById("hb");if(hb)hb.onclick=function(){document.getElementById("hn").style.display="block";hb.style.display="none"};
  var rv=document.getElementById("rv");
  if(rv)rv.onclick=function(){document.getElementById("an").style.display="block";rv.style.display="none"};
  var cl=document.getElementById("cl");if(cl)cl.onclick=close;
  seen[n]=1;save();
}
function close(){if(solo)return;if(location.hash)location.hash="";else{ov.classList.remove("on");draw()}}
ov.onclick=function(e){if(e.target===ov)close()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
var solo=/^#tuerchen-\d+$/.test(location.hash);if(solo)document.body.classList.add("solo");
function route(){var m=/^#tuerchen-(\d+)$/.exec(location.hash),n=m?+m[1]:0;if(n<1||n>24){ov.classList.remove("on");draw();return}if(isOpen(n))show(n);else{card.innerHTML='<div class="big">🔒</div><h2>Türchen '+n+'</h2><p>Dieses Türchen öffnet sich am <b>'+n+'. Dezember</b>. Komm dann einfach wieder!</p>'+(solo?'':'<div style="text-align:right"><button class="btn" id="cl">Schließen</button></div>')+'';ov.classList.add("on");var c2=document.getElementById("cl");if(c2)c2.onclick=close}}
window.addEventListener("hashchange",route);

draw();route();
</script>
