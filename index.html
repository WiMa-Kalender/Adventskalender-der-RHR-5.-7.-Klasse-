<title>Adventskalender der RHR für die 5. - 7. Jahrgangsstufe</title>
<style id="kstyle">
:root{--bg:#fdf3e7;--fg:#2b2320;--card:#fff;--red:#b3262e;--green:#1f6b4a;--gold:#e0a526;--mut:#6d5f57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202a;--fg:#f6ede4;--card:#223040;--red:#e0555c;--green:#4fb98a;--gold:#f0c24a;--mut:#b9aca3}}
:root[data-theme="dark"]{--bg:#17202a;--fg:#f6ede4;--card:#223040;--red:#e0555c;--green:#4fb98a;--gold:#f0c24a;--mut:#b9aca3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;line-height:1.5}
header{text-align:center;padding:24px 16px 8px}
h1{margin:0;font-size:clamp(1.6rem,5vw,2.6rem);color:var(--red)}
header p{margin:6px 0 0;color:var(--mut)}
.bar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 16px;font-size:.9rem;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.door{aspect-ratio:1;border:3px solid var(--gold);border-radius:14px;background:linear-gradient(145deg,var(--red),#7d1a20);color:#fff;font:700 1.9rem "Trebuchet MS",Verdana,sans-serif;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.door:nth-child(3n){background:linear-gradient(145deg,var(--green),#124632)}
.door:hover:not(:disabled){transform:translateY(-2px)}
.door:disabled{opacity:.45;cursor:not-allowed}
.door.open{background:var(--card);color:var(--fg);border-style:dashed;font-size:1.7rem}
.door small{display:block;font-size:.7rem;font-weight:400}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.on{display:flex}
.card{background:var(--card);color:var(--fg);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;border-top:8px solid var(--gold)}
.art{display:block;width:100%;max-width:340px;margin:8px auto;border-radius:14px}
.ans{font-size:1.1rem}
.meme .art{max-width:100%;margin:8px 0}
.solo header,.solo .bar,.solo main{display:none}
.solo #ov{background:var(--bg)}
.tag{display:inline-block;background:var(--green);color:#fff;border-radius:99px;padding:2px 12px;font-size:.8rem}
.card h2{margin:10px 0 6px;color:var(--red)}
.big{font-size:4.5rem;text-align:center;line-height:1.1;margin:8px 0}
.meme{background:#2d3a4a;border-radius:12px;padding:14px 10px;text-align:center;color:#fff;font:900 1.25rem Impact,"Arial Black",sans-serif;text-transform:uppercase;text-shadow:2px 2px 0 #000;margin:10px 0}
.meme .big{text-shadow:none}
.card ol,.card ul{padding-left:22px;margin:6px 0}
.btn{display:inline-block;margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--green)}
.ans{display:none;font-weight:700;color:var(--green);text-align:center;margin-top:10px}
.door.hl{border-color:#ffd54a;box-shadow:0 0 0 3px #ffd54a,0 0 18px 4px rgba(255,213,74,.85);animation:glow 2s ease-in-out infinite}
.door.hl::after{content:"★";position:absolute;top:2px;right:6px;font-size:.9rem;color:#ffd54a}
@keyframes glow{50%{box-shadow:0 0 0 3px #ffd54a,0 0 6px 1px rgba(255,213,74,.5)}}
@media (prefers-reduced-motion:reduce){.door.hl{animation:none}}
.quiz{margin-top:14px;border:3px solid var(--gold);border-radius:16px;padding:14px;background:linear-gradient(145deg,rgba(224,165,38,.16),rgba(224,165,38,.04));text-align:center}
.quiz b.hd{display:block;color:var(--red);font-size:1.1rem;margin-bottom:6px}
.quiz p{margin:6px 0}
.quiz img{width:220px;max-width:70%;height:auto;image-rendering:pixelated;background:#fff;padding:8px;border-radius:10px;border:2px solid #ccc;margin:6px auto;display:block}
.note{font-size:.8rem;color:var(--mut);margin-top:12px}
#adm{max-width:860px;margin:0 auto;padding:0 16px}
.admbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#2b2320;color:#fff;border-radius:14px;padding:10px 12px;margin:8px 0 0}
.admbar .st{flex:1 1 200px;font-size:.85rem}
.admbar .btn{margin-top:0;font-size:.85rem;padding:7px 12px}
.admhint{font-size:.85rem;color:var(--mut);margin:6px 2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.fld{display:block;margin:10px 0;font-weight:700;font-size:.9rem}
.inp{display:block;width:100%;margin-top:4px;font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:2px solid #c9bdb3;background:var(--bg);color:var(--fg)}
textarea.inp{resize:vertical}
.code{height:40vh;font:12px/1.4 monospace}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:.95rem}
.chk input{width:18px;height:18px}
.qzbox{border:2px dashed var(--gold);border-radius:12px;padding:2px 12px 10px}
.qrprev{display:block;max-width:160px;margin:8px 0;background:#fff;padding:6px;border-radius:8px}
.qrprev:not([src]){display:none}
.err{color:var(--red);font-weight:700;margin:6px 0;min-height:1.2em}
</style>
</head>

<script id="prog">
(function(){
var L={z:"⭐ Quiz",f:"💡 Funfact",j:"😂 Flachwitz",q:"🧩 Rätsel",s:"🎵 Liedtipp",m:"🤪 Meme",r:"🍪 Rezept"};
var NAMES={z:"Quiz",f:"Funfact",j:"Flachwitz",q:"Rätsel",s:"Liedtipp",m:"Meme",r:"Rezept"};
var KS=[["z","⭐ Quiz"],["f","💡 Funfact"],["j","😂 Flachwitz"],["q","🧩 Rätsel"],["s","🎵 Liedtipp"],["m","🤪 Meme"]];
var HEAD="// ===== INHALTE DES KALENDERS =====\n// Am einfachsten bearbeitest du alles im Admin-Modus (siehe README) und lädst danach die neue Datei hoch.\n// k = Art: z Quiz, f Funfact, j Flachwitz, q Rätsel, s Liedtipp, m Meme\n// t Titel, e Emoji, b Text (Witz/Rätsel: Frage; Meme: \"oben|unten\"), a Antwort/Lösung, h Tipp, q YouTube-Suchbegriff\n// hl = 1 hebt das Türchen hervor; qr = QR-Bild, ql = Link, qt = Text im Quiz-Kasten\n// ADMIN_HASH = verschlüsseltes Admin-Passwort (im Admin-Modus änderbar)\n";
var BODY='<header>\n  <h1>🎄 Adventskalender der RHR 🎄</h1>\n  <p>für die 5. - 7. Jahrgangsstufe · Jeden Tag ein neues Türchen!</p>\n</header>\n<div id="adm"></div>\n<div class="bar"><span id="info"></span></div>\n<main><div class="grid" id="grid"></div></main>\n<div id="ov"><div class="card" id="card"></div></div>';
var $=function(i){return document.getElementById(i)};
var grid=$("grid"),ov=$("ov"),card=$("card"),info=$("info"),adm=$("adm");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var seen={};try{seen=JSON.parse(ls("adv")||"{}")||{}}catch(e){seen={}}
function saveSeen(){ls("adv",JSON.stringify(seen))}
var ADM=false,dirty=false,editing=false;
var LIVE_HASH=ADMIN_HASH;
var solo=/^#tuerchen-\d+$/.test(location.hash);
if(solo)document.body.classList.add("solo");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function qrSrc(q){return /^data:/.test(q)?q:"data:image/png;base64,"+q}
function yt(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q)}
function isOpen(n){if(ADM)return true;var d=new Date();return d.getMonth()===0||d>=new Date(d.getFullYear(),11,n)}
function quizNr(n){var c=0,t=0;D.forEach(function(x,i){if(x.qr){t++;if(i<n)c=t}});return [c,t]}

function draw(){

  if(x.qr){var qn=quizNr(n);h+='<div class="quiz"><b class="hd">⭐ Weihnachtsquiz '+qn[0]+' von '+qn[1]+' ⭐</b>'+(x.qt?'<p>'+x.qt+'</p>':'')+'<img alt="QR-Code zum Weihnachtsquiz '+qn[0]+'" src="'+qrSrc(x.qr)+'">'+(x.ql?'<p style="font-size:.85rem;color:var(--mut)">Scanne den QR-Code oder klicke auf den Button.</p><a class="btn" target="_blank" rel="noopener" href="'+esc(x.ql)+'">📝 Zum Quiz</a>':'<p style="font-size:.85rem;color:var(--mut)">Scanne den QR-Code.</p>')+'<p class="note">Bitte nur mit Erlaubnis von Lehrkraft oder Eltern öffnen.</p></div>'}
  var btns=(ADM?'<button class="btn alt" id="ed">✏️ Bearbeiten</button>':'')+(solo?'':'<button class="btn" id="cl">Schließen</button>');
  if(btns)h+='<div class="row">'+btns+'</div>';
  card.innerHTML=h;ov.classList.add("on");card.scrollTop=0;
  var hb=$("hb");if(hb)hb.onclick=function(){$("hn").style.display="block";hb.style.display="none"};
  var rv=$("rv");if(rv)rv.onclick=function(){$("an").style.display="block";rv.style.display="none"};
  var cl=$("cl");if(cl)cl.onclick=close;
  var ed=$("ed");if(ed)ed.onclick=function(){edit(n)};
  if(!ADM){seen[n]=1;saveSeen()}
}
function close(){if(solo)return;editing=false;if(location.hash&&location.hash!=="#")location.hash="";else{ov.classList.remove("on");draw()}}
function route(){
  if(editing)return;
  var m=/^#tuerchen-(\d+)$/.exec(location.hash),n=m?+m[1]:0;
  if(n<1||n>24){ov.classList.remove("on");draw();return}
  if(isOpen(n))show(n);
  else{card.innerHTML='<div class="big">🔒</div><h2>Türchen '+n+'</h2><p>Dieses Türchen öffnet sich am <b>'+n+'. Dezember</b>. Komm dann einfach wieder!</p>'+(solo?'':'<div class="row"><button class="btn" id="cl">Schließen</button></div>');ov.classList.add("on");var c2=$("cl");if(c2)c2.onclick=close}
}
ov.onclick=function(e){if(e.target===ov&&!editing)close()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!editing)close()});
window.addEventListener("hashchange",route);

/* ===== Admin ===== */
function h256(t){if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return Promise.reject(new Error("crypto"));return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function draft(){try{return JSON.parse(ls("advDraft")||"null")}catch(e){return null}}
function closeAdm(){editing=false;ov.classList.remove("on");route()}
function msgCard(t,html){editing=true;card.innerHTML='<span class="tag">🔧 Admin</span><h2>'+t+'</h2>'+html+'<div class="row"><button class="btn" id="mx">Schließen</button></div>';ov.classList.add("on");$("mx").onclick=closeAdm}
function login(){
  if(ADM)return;editing=true;
  card.innerHTML='<span class="tag">🔧 Admin</span><h2>Anmeldung</h2><form id="lf"><label class="fld">Admin-Passwort<input type="password" id="pw" class="inp" autocomplete="current-password"></label><p class="err" id="er"></p><div class="row"><button class="btn alt" type="button" id="lc">Abbrechen</button><button class="btn" type="submit">Anmelden</button></div></form>';
  ov.classList.add("on");try{$("pw").focus()}catch(e){}
  $("lc").onclick=closeAdm;
  $("lf").onsubmit=function(e){e.preventDefault();h256($("pw").value).then(function(h){var d=draft();if(h===ADMIN_HASH||(d&&h===d.H)){ls("advAdmin",h);editing=false;enter()}else $("er").textContent="Falsches Passwort."},function(){$("er").textContent="Die Anmeldung funktioniert nur über https (z. B. GitHub Pages)."})};
}
function apply(o){D.length=0;o.D.forEach(function(x){D.push(x)});MR=o.MR||{};AR=o.AR||{};ADMIN_HASH=o.H||ADMIN_HASH}
function enter(){
  ADM=true;solo=false;document.body.classList.remove("solo");document.body.classList.add("admin");
  var d=draft();
  if(d&&d.D){if(JSON.stringify([d.D,d.MR,d.AR,d.H])!==JSON.stringify([D,MR,AR,ADMIN_HASH])){apply(d);dirty=true}else ls("advDraft",null)}
  bar();ov.classList.remove("on");draw();route();
}
function persist(){dirty=true;ls("advDraft",JSON.stringify({D:D,MR:MR,AR:AR,H:ADMIN_HASH}));bar()}
function bar(){
  adm.innerHTML='<div class="admbar"><b>🔧 Admin-Modus</b><span class="st">'+(dirty?'⚠️ Änderungen noch nicht bei GitHub hochgeladen':'✅ Keine offenen Änderungen')+'</span><button class="btn" id="a_dl">⬇️ Datei herunterladen</button><button class="btn alt" id="a_cd">📋 Code anzeigen</button><button class="btn alt" id="a_pw">🔑 Passwort ändern</button>'+(dirty?'<button class="btn alt" id="a_rs">↩️ Änderungen verwerfen</button>':'')+'<button class="btn alt" id="a_out">🚪 Abmelden</button></div><p class="admhint">Türchen öffnen → „✏️ Bearbeiten“ → Speichern. Zum Schluss „Datei herunterladen“ und damit <b>index.html</b> bei GitHub ersetzen.</p>';
  $("a_dl").onclick=dl;$("a_cd").onclick=code;$("a_pw").onclick=pwc;
  $("a_out").onclick=function(){ls("advAdmin",null);if(location.search)location.href=location.pathname;else location.reload()};
  var rs=$("a_rs");if(rs)rs.onclick=function(){if(rs.getAttribute("data-ok")){ls("advDraft",null);ls("advAdmin",LIVE_HASH);location.reload()}else{rs.setAttribute("data-ok","1");rs.textContent="Wirklich verwerfen? Nochmal klicken"}};
}
function J(o,p){return JSON.stringify(o,null,p?1:0).replace(/<\//g,"<\\/")}
function build(){
  var data="\n"+HEAD+"var ADMIN_HASH="+J(ADMIN_HASH)+";\nvar D=[\n"+D.map(function(x,i){return "// Türchen "+(i+1)+" – "+(NAMES[x.k]||x.k)+"\n"+J(x)}).join(",\n")+"\n];\nvar MR="+J(MR,1)+";\nvar AR="+J(AR,1)+";\n";
  return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+esc(document.title)+'</title>\n<style id="kstyle">'+$("kstyle").textContent+'</style>\n</head>\n<body>\n'+BODY+'\n<script id="daten">'+data+'<\/script>\n<script id="prog">'+$("prog").textContent+'<\/script>\n</body>\n</html>\n';
}
window.kalenderDatei=build;
function dl(){
  var s=build();
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/html;charset=utf-8"}));a.download="index.html";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.parentNode.removeChild(a)},3000)}catch(e){}
  msgCard("⬇️ Datei erstellt","<p>Die Datei <b>index.html</b> wurde heruntergeladen. Lade sie bei GitHub hoch und ersetze damit die alte Datei. Nach 1–2 Minuten sind die Änderungen online.</p><p class='note'>Kein Download gestartet? Dann nutze „📋 Code anzeigen“ und kopiere den Text.</p>");
}
function code(){
  editing=true;
  card.innerHTML='<span class="tag">🔧 Admin</span><h2>Code der Seite</h2><p>Kopiere den gesamten Text und ersetze damit den Inhalt von <b>index.html</b> bei GitHub.</p><textarea id="cd" class="inp code" readonly></textarea><p class="err" id="cm"></p><div class="row"><button class="btn alt" id="cx">Schließen</button><button class="btn" id="cp">In Zwischenablage kopieren</button></div>';

  $("cp").onclick=function(){var t=$("cd"),ok=false;t.focus();t.select();try{ok=document.execCommand("copy")}catch(e){}
    var done=function(){$("cm").textContent="✅ Kopiert!"},fail=function(){$("cm").textContent=ok?"✅ Kopiert!":"Bitte den Text markieren und mit Strg+C kopieren."};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,fail);else fail()};
}
function pwc(){
  editing=true;
  card.innerHTML='<span class="tag">🔧 Admin</span><h2>Passwort ändern</h2><form id="pf"><label class="fld">Neues Passwort<input type="password" id="p1" class="inp" autocomplete="new-password"></label><label class="fld">Neues Passwort wiederholen<input type="password" id="p2" class="inp" autocomplete="new-password"></label><p class="err" id="pe"></p><div class="row"><button class="btn alt" type="button" id="px">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form><p class="note">Das neue Passwort gilt online erst, wenn du die neue Datei bei GitHub hochgeladen hast.</p>';
  ov.classList.add("on");$("px").onclick=closeAdm;
  $("pf").onsubmit=function(e){e.preventDefault();var a=$("p1").value,b=$("p2").value;

    if(a!==b){$("pe").textContent="Die beiden Passwörter stimmen nicht überein.";return}
    h256(a).then(function(h){ADMIN_HASH=h;ls("advAdmin",h);persist();msgCard("🔑 Passwort geändert","<p>Lade jetzt die neue Datei herunter und bei GitHub hoch. Bis dahin gilt online noch das alte Passwort.</p>")})};
}
function edit(n){
  editing=true;var x=D[n-1],mm=(x.k==="m"?(x.b||""):"").split("|"),pic=!!(AR[n]||MR[n]),nq=null;
  var opt=KS.map(function(k){return '<option value="'+k[0]+'"'+(x.k===k[0]?' selected':'')+'>'+k[1]+'</option>'}).join("");
  function f(id,label,val,forK,area){return '<label class="fld"'+(forK?' data-for="'+forK+'"':'')+'>'+label+(area?'<textarea id="'+id+'" class="inp" rows="4">'+esc(val)+'</textarea>':'<input id="'+id+'" class="inp" value="'+esc(val)+'">')+'</label>'}
  card.innerHTML='<span class="tag">✏️ Türchen '+n+' bearbeiten</span><h2>'+x.t+'</h2><form id="ef">'+
    '<label class="fld">Art<select id="f_k" class="inp">'+opt+'</select></label>'+
    f("f_t","Titel",x.t)+f("f_e","Emoji (großes Bild)",x.e)+
    f("f_b","Text (bei Witz und Rätsel: die Frage)",x.k==="m"?"":x.b,"f j q s z",1)+
    f("f_mo","Meme-Text oben",mm[0],"m")+f("f_mu","Meme-Text unten",mm[1]||"","m")+
    f("f_a","Antwort / Lösung",x.a,"j q",1)+f("f_h","Tipp (leer = kein Tipp-Button)",x.h,"q")+f("f_q","YouTube-Suchbegriff",x.k==="s"?x.q:"","s")+
    (pic?'<label class="chk"><input type="checkbox" id="f_pic" checked> Gezeichnetes Bild behalten</label>':'')+
    '<label class="chk"><input type="checkbox" id="f_hl"'+(x.hl?' checked':'')+'> In der Übersicht hervorheben (goldener Rahmen)</label>'+
    '<label class="chk"><input type="checkbox" id="f_qz"'+(x.qr?' checked':'')+'> Quiz-Kasten mit QR-Code anzeigen</label>'+
    '<div id="qzbox" class="qzbox">'+f("f_ql","Link zum Quiz (https://…)",x.ql)+f("f_qt","Text im Quiz-Kasten",x.qt,"",1)+
    '<label class="fld">QR-Code-Bild '+(x.qr?'(nur zum Ersetzen auswählen)':'')+'<input type="file" id="f_qf" accept="image/*" class="inp"></label><img id="f_qi" class="qrprev" alt="QR-Code-Vorschau"'+(x.qr?' src="'+qrSrc(x.qr)+'"':'')+'></div>'+
    '<p class="note">Fett schreiben: &lt;b&gt;Text&lt;/b&gt;</p><p class="err" id="fe"></p>'+
    '<div class="row"><button class="btn alt" type="button" id="fx">Abbrechen</button><button class="btn" type="submit">💾 Speichern</button></div></form>';
  ov.classList.add("on");card.scrollTop=0;
  var ks=$("f_k");
  function upd(){var k=ks.value;Array.prototype.forEach.call(card.querySelectorAll("[data-for]"),function(r){r.style.display=r.getAttribute("data-for").split(" ").indexOf(k)>=0?"":"none"});$("qzbox").style.display=$("f_qz").checked?"":"none"}
